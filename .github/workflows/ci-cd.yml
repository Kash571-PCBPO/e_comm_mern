name: CI/CD

# One pipeline, three environments: dev, qa, and production
on:
  push:
    branches: [dev, qa, main]
    tags: ["v*"]
  pull_request:
    branches: [dev, qa, main]

env:
  REGISTRY: ghcr.io

jobs:
  # =========================
  # TESTING
  # =========================
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
          - service: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        working-directory: ${{ matrix.service }}
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run Tests
        working-directory: ${{ matrix.service }}
        run: npm test --if-present

  # =========================
  # BUILD AND PUSH IMAGES
  # =========================
  build-and-push:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image names
        id: image
        shell: bash
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          echo "backend=${{ env.REGISTRY }}/${OWNER}/${REPO}/backend" >> "$GITHUB_OUTPUT"
          echo "frontend=${{ env.REGISTRY }}/${OWNER}/${REPO}/frontend" >> "$GITHUB_OUTPUT"

      - name: Generate image tag
        id: tag
        shell: bash
        run: echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.image.outputs.backend }}:${{ steps.tag.outputs.value }}
            ${{ steps.image.outputs.backend }}:latest

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.image.outputs.frontend }}:${{ steps.tag.outputs.value }}
            ${{ steps.image.outputs.frontend }}:latest

  # =========================
  # DEPLOY: DEV
  # =========================
  deploy-dev:
    if: github.ref == 'refs/heads/dev'
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: ${{ vars.APP_URL }}
    steps:
      - name: Deploy Image to Dev
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          echo "Deploying backend + frontend @ ${IMAGE_TAG} to dev"

  # =========================
  # DEPLOY: QA
  # =========================
  deploy-qa:
    if: github.ref == 'refs/heads/qa'
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: qa
      url: ${{ vars.APP_URL }}
    steps:
      - name: Deploy Image to QA
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          echo "Deploying backend + frontend @ ${IMAGE_TAG} to qa"

  # =========================
  # DEPLOY: PRODUCTION
  # =========================
  deploy-production:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    steps:
      - name: Deploy Image to Production
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          echo "Deploying backend + frontend @ ${IMAGE_TAG} to production"
