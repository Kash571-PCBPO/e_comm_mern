name: CI/CD

# One pipeline, three environments: dev, qa, and production

on:
  push:
    branches: [dev, qa, main]
    tags: ["v*"]
  pull_request:
    branches: [dev, qa, main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository }}/backend
  FRONTEND_IMAGE: ${{ github.repository }}/frontend

jobs:
  # TESTING
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: backend
            lockfile: backend/package-lock.json
          - service: frontend
            lockfile: frontend/package-lock.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        working-directory: ${{ matrix.service }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run Tests
        working-directory: ${{ matrix.service }}
        run: npm test --if-present

  # BUILDING (Only on push and only after tests pass.)
  build-and-push:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ steps.tag.outputs.value }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ steps.tag.outputs.value }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest

  # Deploy: dev
  deploy-dev:
    if: github.ref == 'refs/heads/dev'
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: ${{ vars.APP_URL }}
    steps:
      - name: Deploy Image to Dev
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          echo "Deploying backend+frontend @ ${IMAGE_TAG} to dev"

  # Deploy: qa
  deploy-qa:
    if: github.ref == 'refs/heads/qa'
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: qa
      url: ${{ vars.APP_URL }}
    steps:
      - name: Deploy Image to QA
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          echo "Deploying backend+frontend @ ${IMAGE_TAG} to qa"

  # Deploy: production
  deploy-production:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    steps:
      - name: Deploy Image to Production
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          echo "Deploying backend+frontend @ ${IMAGE_TAG} to production"
