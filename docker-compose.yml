services:
  mongo:
    image: mongo:7
    container_name: mongo_e_comm
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - mern_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_e_comm
    restart: unless-stopped
    ports:
      - "5002:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/ecomm_db
    depends_on:
      - mongo
    networks:
      - mern_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5000/api
    container_name: frontend_e_comm
    restart: unless-stopped
    ports:
      - "82:80"
    depends_on:
      - backend
    networks:
      - mern_network

networks:
  mern_network:
    driver: bridge

volumes:
  mongo_data:
