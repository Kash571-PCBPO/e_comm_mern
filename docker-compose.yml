services:
  mongo:
    image: mongo:7
    container_name: mongo_e_comm
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - mern_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_e_comm
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/ecomm_db
    depends_on:
      - mongo
    networks:
      - mern_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend_e_comm
    restart: unless-stopped
    environment:
      API_BASE_URL: /api
    depends_on:
      - backend
    networks:
      - mern_network

  proxy:
    image: nginx:1.27-alpine
    container_name: mern_proxy
    restart: unless-stopped
    ports:
      - "82:80"
    volumes:
      - ./nginx/reverse-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - mern_network

networks:
  mern_network:
    driver: bridge

volumes:
  mongo_data: