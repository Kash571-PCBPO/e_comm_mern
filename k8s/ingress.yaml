apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: e-comm
  namespace: e-comm
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  # Must match a class returned by `kubectl get ingressclass`.
  ingressClassName: nginx
  rules:
    # No host condition: use the cluster's public IP or DNS name directly.
    # Add `host:` later after creating a DNS record.
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
