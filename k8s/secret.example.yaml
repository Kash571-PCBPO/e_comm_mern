apiVersion: v1
kind: Secret
metadata:
  name: ghcr-secret
  namespace: e-comm
type: kubernetes.io/dockerconfigjson
stringData:
  # Do not commit a real Docker config here. Create this Secret with kubectl;
  # see K8S-SETUP.md section 2.
  .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"YOUR_GITHUB_USERNAME","password":"YOUR_GITHUB_PAT","auth":"BASE64_USERNAME_COLON_PAT"}}}'
